image: node:20

default:
  tags:
    - us

stages:
  - verify
  - release
  - sync

variables:
  GITHUB_REPOSITORY: "QONIAI/qoni-sdk-node"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

verify:
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    # build first: tests/package-surface.test.ts imports the built dist/, so
    # `tsc --noEmit` (which typechecks tests/) can't resolve it until dist exists.
    - pnpm build
    - pnpm check:brand
    - pnpm typecheck
    - pnpm test:ci
    - pnpm pack --dry-run

sync_github:
  stage: release
  needs:
    - verify
  variables:
    # Mirror pushes must send complete objects. The default shallow clone
    # (GIT_DEPTH 20) makes git build a thin pack whose delta base can fall
    # outside the shallow boundary, which GitHub then rejects with
    # "did not receive expected object ... / index-pack failed". A full
    # clone gives git every object it needs to assemble the pack.
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - git --version
  script:
    - test -n "$GITHUB_TOKEN"
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git fetch origin "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}" || true
        git push --no-thin github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
      else
        git push --no-thin github "${CI_COMMIT_SHA}:refs/heads/${CI_COMMIT_REF_NAME}"
      fi
  after_script:
    - git remote remove github 2>/dev/null || true

publish_npm:
  stage: release
  needs:
    - verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
    - when: never
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - test -n "$QONI_NPM_TOKEN"
    - printf '//registry.npmjs.org/:_authToken=%s\n' "$QONI_NPM_TOKEN" > .npmrc
    - npm whoami
    - npm org ls qoniai --json
    - npm access list packages @qoniai --json
    - pnpm build
    - npm publish --access public --registry https://registry.npmjs.org/
  after_script:
    - rm -f .npmrc

.sync_main_or_master:
  stage: sync
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  tags: []
  needs: []
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
  script:
    - |
      set -eu

      test -n "${SYNC_SSH_PRIVATE_KEY_FILE:-}"
      test -f "$SYNC_SSH_PRIVATE_KEY_FILE"

      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      awk '{ sub(/\r$/, ""); print }' "$SYNC_SSH_PRIVATE_KEY_FILE" > ~/.ssh/repository_sync_key
      chmod 600 ~/.ssh/repository_sync_key
      printf '%s\n' "$SYNC_TARGET_HOST_KEY" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts

      export GIT_SSH_COMMAND="ssh -i ~/.ssh/repository_sync_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
      git remote remove sync_target 2>/dev/null || true
      git remote add sync_target "$SYNC_TARGET_REPOSITORY"

      target_sha="$(git ls-remote sync_target "refs/heads/${CI_COMMIT_BRANCH}" | awk '{print $1}')"
      if [ -n "$target_sha" ]; then
        git fetch --no-tags sync_target "refs/heads/${CI_COMMIT_BRANCH}:refs/remotes/sync_target/${CI_COMMIT_BRANCH}"
        if ! git merge-base --is-ancestor "$target_sha" "$CI_COMMIT_SHA"; then
          echo "ERROR: Target ${CI_COMMIT_BRANCH} has diverged; refusing to overwrite it."
          exit 1
        fi
      fi

      git push --no-thin -o ci.skip sync_target "${CI_COMMIT_SHA}:refs/heads/${CI_COMMIT_BRANCH}"

sync_main_or_master_to_fellou:
  extends: .sync_main_or_master
  tags:
    - eak-us
  variables:
    SYNC_SSH_PRIVATE_KEY_FILE: "$FELLOU_SYNC_SSH_PRIVATE_KEY"
    SYNC_TARGET_REPOSITORY: "ssh://git@gitlab.asix.inc:6022/sak/qoni-sdk-node.git"
    SYNC_TARGET_HOST_KEY: "[gitlab.asix.inc]:6022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJPT8mi8hCLKAg7gMVOzOsFFiQAsU/sEmWSykPsdyWGV"
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.authing-inc.co" && $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
    - when: never

sync_main_or_master_to_authing:
  extends: .sync_main_or_master
  variables:
    SYNC_SSH_PRIVATE_KEY_FILE: "$AUTHING_SYNC_SSH_PRIVATE_KEY"
    SYNC_TARGET_REPOSITORY: "ssh://git@gitlab.authing-inc.co:22/sak-steamory-agent-kit/qoni-sdk-node.git"
    SYNC_TARGET_HOST_KEY: "gitlab.authing-inc.co ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKmQ1URQCIBWHjkS6Q2TK+aTeFm/gvot3Vgsxj0iI5dQ"
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.asix.inc" && $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
    - when: never
