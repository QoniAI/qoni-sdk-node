image: node:20

default:
  tags:
    - qoni-runner

stages:
  - verify
  - release

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

verify:
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    # build first: tests/package-surface.test.ts imports the built dist/, so
    # `tsc --noEmit` (which typechecks tests/) can't resolve it until dist exists.
    - pnpm build
    - pnpm check:brand
    - pnpm typecheck
    - pnpm test:ci
    - pnpm pack --dry-run

publish_npm:
  stage: release
  needs:
    - verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
    - when: never
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - test -n "$QONI_NPM_TOKEN"
    - printf '//registry.npmjs.org/:_authToken=%s\n' "$QONI_NPM_TOKEN" > .npmrc
    - npm whoami
    - npm org ls qoniai --json
    - npm access list packages @qoniai --json
    - pnpm build
    - npm publish --access public --registry https://registry.npmjs.org/
  after_script:
    - rm -f .npmrc
